<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudyMate</title>

    <!-- Remove favicon 404 -->
    <link rel="icon" href="data:,">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            margin: 0;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            color: #1e293b;
        }


        .container {

            max-width: 1100px;

            margin: auto;

            padding: 30px 20px;
        }


        /* HEADER */

        header {

            text-align: center;

            margin-bottom: 30px;
        }


        header h1 {

            font-size: 42px;

            color: #4f46e5;

            margin-bottom: 8px;
        }


        header p {

            color: #64748b;

            font-size: 18px;
        }


        /* COMMON CARD */

        .card {

            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);

            margin-bottom: 30px;
        }


        /* FORM */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        .input-group {

            display: flex;

            flex-direction: column;
        }


        .input-group label {

            font-weight: bold;

            margin-bottom: 8px;
        }


        input {

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px
                rgba(79,70,229,0.12);
        }


        .primary-btn {

            width: 100%;

            padding: 14px;

            margin-top: 25px;

            background: #4f46e5;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        .primary-btn:hover {

            background: #3730a3;
        }


        #result {

            margin-top: 20px;
        }


        /* RESULT */

        .result-card {

            background: white;

            padding: 25px;

            border-radius: 15px;

            border-left:
                6px solid #4f46e5;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

            margin-bottom: 30px;
        }


        .success-title {

            color: #16a34a;

            margin-top: 0;
        }


        /* STATISTICS */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }


        .stat-card {

            background: white;

            padding: 25px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.07);

            transition:
                transform 0.2s;
        }


        .stat-card:hover {

            transform:
                translateY(-4px);
        }


        .stat-icon {

            font-size: 32px;
        }


        .stat-card h3 {

            margin: 8px 0;

            font-size: 27px;

            color: #4f46e5;
        }


        .stat-card p {

            margin: 0;

            color: #64748b;

            font-weight: bold;
        }


        /* TOP PERFORMER */

        .top-performer {

            background:
                linear-gradient(
                    135deg,
                    #dcfce7,
                    #f0fdf4
                );

            border:
                2px solid #22c55e;

            box-shadow:
                0 8px 25px
                rgba(34,197,94,0.18);
        }


        .top-performer h3 {

            color: #15803d;
        }


        /* SEARCH */

        .search-card {

            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

            margin-bottom: 30px;
        }


        .search-box {

            display: flex;

            gap: 10px;
        }


        .search-box input {

            flex: 1;
        }


        .clear-btn {

            padding: 0 20px;

            background: #64748b;

            color: white;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;
        }


        .clear-btn:hover {

            background: #475569;
        }


        /* CHART */

        .chart-container {

            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

            margin-bottom: 30px;
        }


        .chart-box {

            position: relative;

            height: 400px;
        }


        /* DASHBOARD HEADER */

        .dashboard-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .dashboard-header h2 {

            margin: 0;
        }


        .refresh-btn {

            padding: 11px 18px;

            background: #0f172a;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;
        }


        .refresh-btn:hover {

            background: #334155;
        }


        /* STUDENT GRID */

        #students-container {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 20px;
        }


        /* STUDENT CARD */

        .student-card {

            background: white;

            padding: 22px;

            border-radius: 15px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

            border-top:
                5px solid #4f46e5;

            transition:
                transform 0.2s;
        }


        .student-card:hover {

            transform:
                translateY(-4px);
        }


        .student-card h3 {

            margin-top: 0;

            color: #334155;

            font-size: 22px;
        }


        .student-card p {

            margin: 10px 0;

            line-height: 1.5;
        }


        /* TOP STUDENT CARD */

        .student-card.top-student {

            border-top:
                5px solid #22c55e;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #f0fdf4
                );
        }


        .winner-badge {

            display: inline-block;

            background: #22c55e;

            color: white;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        /* BUTTONS */

        .button-row {

            display: flex;

            justify-content:
                space-between;

            gap: 10px;

            margin-top: 15px;
        }


        .edit-btn {

            width: 50%;

            padding: 10px;

            background: #f59e0b;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;
        }


        .delete-btn {

            width: 50%;

            padding: 10px;

            background: #ef4444;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;
        }


        .edit-btn:hover {

            background: #d97706;
        }


        .delete-btn:hover {

            background: #dc2626;
        }


        /* EMPTY */

        .empty-card {

            background: white;

            padding: 30px;

            text-align: center;

            border-radius: 15px;

            color: #64748b;

            grid-column:
                1 / -1;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            .form-grid {

                grid-template-columns:
                    1fr;
            }


            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .dashboard-header {

                flex-direction:
                    column;

                align-items:
                    flex-start;

                gap: 10px;
            }

        }


        @media (max-width: 500px) {

            .container {

                padding:
                    20px 12px;
            }


            header h1 {

                font-size: 32px;
            }


            .stats {

                grid-template-columns:
                    1fr;
            }


            .chart-box {

                height: 300px;
            }


            .search-box {

                flex-direction:
                    column;
            }


            .clear-btn {

                padding: 12px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <header>

        <h1>
            📖 StudyMate AI
        </h1>

        <p>
            Smart Student Study Planner
        </p>

    </header>



    <!-- ADD STUDENT -->

    <div class="card">

        <h2>
            ➕ Add Student
        </h2>


        <form id="studentForm">


            <div class="form-grid">


                <div class="input-group">

                    <label>
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Study Hours
                    </label>

                    <input
                        type="number"
                        id="study_hours"
                        step="0.1"
                        min="0"
                        placeholder="Example: 3.5"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Mark
                    </label>

                    <input
                        type="number"
                        id="mark"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="0 - 100"
                        required
                    >

                </div>


            </div>


        <!-- (debug bar removed) -->


            <button
                type="button"
                id="submitBtn"
                class="primary-btn"
                onclick="generateStudyPlan()"
            >

                📖 Generate Study Plan

            </button>


            <!-- RESULT -->

            <div id="result"></div>


        </form>

    </div>



    <!-- STATISTICS -->

    <h2>
        📊 Dashboard Statistics
    </h2>


    <div class="stats">


        <div class="stat-card">

            <div class="stat-icon">
                👨‍🎓
            </div>

            <h3 id="totalStudents">
                0
            </h3>

            <p>
                Total Students
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📝
            </div>

            <h3 id="averageMark">
                0
            </h3>

            <p>
                Average Mark
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📚
            </div>

            <h3 id="averageHours">
                0
            </h3>

            <p>
                Average Study Hours
            </p>

        </div>


        <div
            class="stat-card top-performer"
        >

            <div class="stat-icon">
                🏆
            </div>

            <h3 id="topStudent">
                -
            </h3>

            <p>
                Top Performer
            </p>

        </div>


    </div>



    <!-- CHART -->

    <div class="chart-container">

        <h2>
            📈 Student Performance
        </h2>


        <div class="chart-box">

            <canvas id="marksChart"></canvas>

        </div>

    </div>



    <!-- SEARCH -->

    <div class="search-card">

        <h2>
            🔍 Search Student
        </h2>


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search student by name..."
                oninput="searchStudents()"
            >


            <button
                class="clear-btn"
                onclick="clearSearch()"
            >

                Clear

            </button>

        </div>

    </div>



    <!-- DASHBOARD -->

    <div class="dashboard-header">

        <h2>
            👨‍🎓 Student Dashboard
        </h2>


        <button
            class="refresh-btn"
            onclick="loadStudents()"
        >

            🔄 Refresh

        </button>

    </div>


    <div id="students-container"></div>


</div>



<script>


/* =========================================
   API
========================================= */


// Uses whatever address this page is currently being viewed from,
// so it works both on your computer (127.0.0.1:8000) and on Render
// (studymate-ai-ay22.onrender.com) without needing to change anything.
const API_URL =
    window.location.origin;



/* =========================================
   VARIABLES
========================================= */


const form =
    document.getElementById(
        "studentForm"
    );


const result =
    document.getElementById(
        "result"
    );


const studentsContainer =
    document.getElementById(
        "students-container"
    );


let allStudents = [];


let marksChart = null;



/* =========================================
   ESCAPE HTML
   Prevents a student name containing quotes,
   <, > etc. from breaking the card markup or
   the data-* attributes it's placed into.
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

}



/* =========================================
   EDIT / DELETE BUTTON CLICKS
   Uses event delegation + data-* attributes
   instead of inline onclick, so values never
   have to be embedded as raw JS inside an
   HTML attribute (that was breaking the Edit
   button whenever JSON.stringify added its
   own double quotes).
========================================= */

studentsContainer.addEventListener(
    "click",
    function(event) {

        const button = event.target.closest(
            "button[data-action]"
        );

        if (!button) {
            return;
        }

        const studentId = Number(
            button.dataset.id
        );

        if (button.dataset.action === "delete") {

            deleteStudent(studentId);

        } else if (button.dataset.action === "edit") {

            editStudent(
                studentId,
                button.dataset.name,
                button.dataset.studyHours,
                button.dataset.mark
            );

        }

    }
);



/* =========================================
   CREATE STUDENT
========================================= */


const submitBtn =
    document.getElementById(
        "submitBtn"
    );


const debugBar = null; // debug bar removed from the page


function setDebug(text) {

    console.log(text);

}


async function generateStudyPlan() {

    try {

        setDebug("Button clicked. Reading form fields...");

        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const studyHoursRaw =
            document.getElementById(
                "study_hours"
            ).value;


        const markRaw =
            document.getElementById(
                "mark"
            ).value;


        const study_hours = Number(studyHoursRaw);
        const mark = Number(markRaw);


        setDebug(
            "Values read -> name: '" + name +
            "', study_hours: '" + studyHoursRaw +
            "' (" + study_hours + ")" +
            ", mark: '" + markRaw + "' (" + mark + ")"
        );


        if (name === "") {
            setDebug("Stopped: name is empty.");
            alert("Please enter student name.");
            return;
        }

        if (studyHoursRaw === "" || Number.isNaN(study_hours) || study_hours < 0) {
            setDebug("Stopped: study hours is missing or invalid.");
            alert("Please enter a valid study hours (0 or more).");
            return;
        }

        if (markRaw === "" || Number.isNaN(mark) || mark < 0 || mark > 100) {
            setDebug("Stopped: mark is missing or invalid.");
            alert("Please enter a valid mark (0 to 100).");
            return;
        }


        setDebug("Validation passed. Showing loading state in result box...");

        result.innerHTML = `

            <div class="result-card">

                <h3>
                    ⏳ Generating Study Plan...
                </h3>

            </div>

        `;


        setDebug("Sending request to " + API_URL + "/student ...");

        const response =
            await fetch(
                `${API_URL}/student`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        study_hours: study_hours,
                        mark: mark
                    })
                }
            );


        setDebug("Got response, status: " + response.status + ". Parsing JSON...");

        const data = await response.json();


        if (!response.ok) {
            setDebug("Server returned an error: " + JSON.stringify(data));
            throw new Error(
                (data && data.detail) || "Failed to save student."
            );
        }


        setDebug("Success! Writing result card into #result box now.");


        /* SHOW RESULT */

        result.innerHTML = `

            <div class="result-card">

                <h3
                    class="success-title"
                >

                    ✅ Student Saved Successfully!

                </h3>


                <p>
                    👤
                    <b>Name:</b>
                    ${data.name}
                </p>


                <p>
                    📚
                    <b>Study Hours:</b>
                    ${data.study_hours}
                </p>


                <p>
                    📝
                    <b>Mark:</b>
                    ${data.mark}
                </p>


                <p>
                    🏆
                    <b>Level:</b>
                    ${data.level}
                </p>


                <p>
                    💡
                    <b>Suggestion:</b>
                    ${data.suggestion}
                </p>


                <p>
                    📖
                    <b>Study Plan:</b>
                    ${data.study_plan}
                </p>

            </div>

        `;


        setDebug("Result card written. Refreshing dashboard list...");


        form.reset();


        await loadStudents();


        setDebug("Done. Dashboard refreshed.");


    }


    catch(error) {


        console.error(
            error
        );


        setDebug("ERROR CAUGHT: " + error.message);


        result.innerHTML = `

            <div class="result-card">

                <h3>
                    ❌ Error
                </h3>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}


window.addEventListener("error", function(event) {

    setDebug(
        "UNCAUGHT SCRIPT ERROR: " + event.message +
        " (line " + event.lineno + ")"
    );

});



/* =========================================
   LOAD STUDENTS
========================================= */


async function loadStudents() {


    try {


        const response =
            await fetch(
                `${API_URL}/students`
            );


        const data =
            await response.json();


        allStudents =
            data.students || [];


        updateStatistics(
            allStudents
        );


        createMarksChart(
            allStudents
        );


        displayStudents(
            allStudents
        );


    }


    catch(error) {


        console.error(
            error
        );


        studentsContainer.innerHTML = `

            <div class="empty-card">

                <h3>
                    ❌ Could not load students
                </h3>

                <p>
                    Make sure FastAPI server
                    is running.
                </p>

            </div>

        `;

    }

}



/* =========================================
   DISPLAY STUDENTS
========================================= */


function displayStudents(
    students
) {


    studentsContainer.innerHTML =
        "";


    if (
        students.length === 0
    ) {

        const searchBoxValue =
            document.getElementById(
                "searchInput"
            ).value.trim();

        const isSearching =
            searchBoxValue !== "";

        studentsContainer.innerHTML = isSearching
            ? `
                <div class="empty-card">

                    <h3>
                        🔍 Student Not Found
                    </h3>

                    <p>
                        No student named "${escapeHtml(searchBoxValue)}" was found.
                    </p>

                </div>
            `
            : `
                <div class="empty-card">

                    <h3>
                        👨‍🎓 No Students Yet
                    </h3>

                    <p>
                        Add a student above to get started.
                    </p>

                </div>
            `;

        return;

    }


    /* Find top performer */

    const topStudent =
        allStudents.length > 0
            ? allStudents.reduce(
                function(top, student) {

                    return Number(
                        student.mark
                    ) >
                    Number(top.mark)
                        ? student
                        : top;

                }
            )
            : null;


    students.forEach(
        function(student) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "student-card";


            /* Top performer check */

            const isTopStudent =
                topStudent &&
                student.id ===
                topStudent.id;


            if (
                isTopStudent
            ) {

                card.classList.add(
                    "top-student"
                );

            }


            card.innerHTML = `

                ${
                    isTopStudent
                    ?
                    `
                    <span
                        class="winner-badge"
                    >
                        🏆 TOP PERFORMER
                    </span>
                    `
                    :
                    ""
                }


                <h3>

                    🎓 ${student.name}

                </h3>


                <p>

                    📚
                    <b>Study Hours:</b>
                    ${student.study_hours}

                </p>


                <p>

                    📝
                    <b>Mark:</b>
                    ${student.mark}

                </p>


                <p>

                    🏆
                    <b>Level:</b>
                    ${student.level}

                </p>


                <p>

                    💡
                    <b>Suggestion:</b>
                    ${student.suggestion}

                </p>


                <p>

                    📖
                    <b>Study Plan:</b>
                    ${student.study_plan}

                </p>


                <div
                    class="button-row"
                >


                    <button
                        class="edit-btn"
                        data-action="edit"
                        data-id="${student.id}"
                        data-name="${escapeHtml(student.name)}"
                        data-study-hours="${student.study_hours}"
                        data-mark="${student.mark}"
                    >

                        ✏️ Edit

                    </button>


                    <button
                        class="delete-btn"
                        data-action="delete"
                        data-id="${student.id}"
                    >

                        🗑️ Delete

                    </button>


                </div>

            `;


            studentsContainer.appendChild(
                card
            );

        }
    );

}



/* =========================================
   STATISTICS
========================================= */


function updateStatistics(
    students
) {


    const total =
        students.length;


    document.getElementById(
        "totalStudents"
    ).textContent =
        total;


    if (
        total === 0
    ) {

        document.getElementById(
            "averageMark"
        ).textContent =
            "0";


        document.getElementById(
            "averageHours"
        ).textContent =
            "0";


        document.getElementById(
            "topStudent"
        ).textContent =
            "-";


        return;

    }


    /* Average mark */


    const totalMarks =
        students.reduce(
            function(sum, student) {

                return (
                    sum +
                    Number(
                        student.mark
                    )
                );

            },
            0
        );


    const averageMark =
        (
            totalMarks /
            total
        ).toFixed(1);


    document.getElementById(
        "averageMark"
    ).textContent =
        averageMark;



    /* Average study hours */


    const totalHours =
        students.reduce(
            function(sum, student) {

                return (
                    sum +
                    Number(
                        student.study_hours
                    )
                );

            },
            0
        );


    const averageHours =
        (
            totalHours /
            total
        ).toFixed(1);


    document.getElementById(
        "averageHours"
    ).textContent =
        averageHours;



    /* Top performer */


    const topStudent =
        students.reduce(
            function(top, student) {

                return Number(
                    student.mark
                ) >
                Number(top.mark)
                    ? student
                    : top;

            }
        );


    document.getElementById(
        "topStudent"
    ).textContent =
        topStudent.name;

}



/* =========================================
   SEARCH
========================================= */


function searchStudents() {


    const searchText =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    setDebug(
        "Search typed: '" + searchText + "'. " +
        "Total students loaded: " + allStudents.length
    );


    if (
        searchText === ""
    ) {

        displayStudents(
            allStudents
        );

        return;

    }


    const filteredStudents =
        allStudents.filter(
            function(student) {

                return student.name
                    .toLowerCase()
                    .includes(
                        searchText
                    );

            }
        );


    setDebug(
        "Search typed: '" + searchText + "'. " +
        "Matches found: " + filteredStudents.length
    );


    displayStudents(
        filteredStudents
    );

}



/* =========================================
   CLEAR SEARCH
========================================= */


function clearSearch() {


    document.getElementById(
        "searchInput"
    ).value =
        "";


    displayStudents(
        allStudents
    );

}



/* =========================================
   CHART
========================================= */


function createMarksChart(
    students
) {


    const canvas =
        document.getElementById(
            "marksChart"
        );


    if (
        !canvas
    ) {

        return;

    }


    if (
        marksChart !== null
    ) {

        marksChart.destroy();

        marksChart = null;

    }


    if (
        students.length === 0
    ) {

        return;

    }


    const names =
        students.map(
            function(student) {

                return student.name;

            }
        );


    const marks =
        students.map(
            function(student) {

                return Number(
                    student.mark
                );

            }
        );


    marksChart =
        new Chart(
            canvas,
            {

                type:
                    "bar",


                data: {

                    labels:
                        names,


                    datasets: [

                        {

                            label:
                                "Student Marks",


                            data:
                                marks,


                            backgroundColor:
                                [
                                    "#4f46e5",
                                    "#7c3aed",
                                    "#2563eb",
                                    "#0891b2",
                                    "#059669",
                                    "#16a34a",
                                    "#ca8a04",
                                    "#ea580c"
                                ],


                            borderRadius:
                                8

                        }

                    ]

                },


                options: {

                    responsive:
                        true,


                    maintainAspectRatio:
                        false,


                    scales: {

                        y: {

                            beginAtZero:
                                true,


                            max:
                                100,


                            ticks: {

                                stepSize:
                                    10

                            },


                            title: {

                                display:
                                    true,

                                text:
                                    "Marks"

                            }

                        }

                    }

                }

            }
        );

}



/* =========================================
   DELETE
========================================= */


async function deleteStudent(
    studentId
) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this student?"
        );


    if (
        !confirmDelete
    ) {

        return;

    }


    try {


        const response =
            await fetch(
                `${API_URL}/student/${studentId}`,
                {

                    method:
                        "DELETE"

                }
            );


        const data =
            await response.json();


        alert(
            data.message
        );


        await loadStudents();


    }


    catch(error) {


        console.error(
            error
        );


        alert(
            "Could not delete student."
        );

    }

}



/* =========================================
   EDIT
========================================= */


async function editStudent(

    studentId,

    oldName,

    oldStudyHours,

    oldMark

) {


    const name =
        prompt(
            "Enter student name:",
            oldName
        );


    if (
        name === null
    ) {

        return;

    }


    const studyHours =
        prompt(
            "Enter study hours:",
            oldStudyHours
        );


    if (
        studyHours === null
    ) {

        return;

    }


    const mark =
        prompt(
            "Enter mark:",
            oldMark
        );


    if (
        mark === null
    ) {

        return;

    }


    const newStudyHours =
        Number(
            studyHours
        );


    const newMark =
        Number(
            mark
        );


    if (
        name.trim() === ""
    ) {

        alert(
            "Name cannot be empty."
        );

        return;

    }


    if (
        Number.isNaN(
            newStudyHours
        ) ||
        newStudyHours < 0
    ) {

        alert(
            "Enter a valid study hour."
        );

        return;

    }


    if (
        Number.isNaN(
            newMark
        ) ||
        newMark < 0 ||
        newMark > 100
    ) {

        alert(
            "Mark must be between 0 and 100."
        );

        return;

    }


    try {


        const response =
            await fetch(
                `${API_URL}/student/${studentId}`,
                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            name:
                                name.trim(),

                            study_hours:
                                newStudyHours,

                            mark:
                                newMark

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            alert(
                data.message ||
                "Update failed!"
            );

            return;

        }


        alert(
            data.message
        );


        await loadStudents();


    }


    catch(error) {


        console.error(
            error
        );


        alert(
            "Could not update student."
        );

    }

}



/* =========================================
   INITIAL LOAD
========================================= */


loadStudents();


</script>
